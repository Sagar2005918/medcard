services:
  - type: web
    name: national-health-id-system
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false           # Set this to your Neon PostgreSQL connection string
      - key: JWT_EXPIRES_IN
        value: 7d
